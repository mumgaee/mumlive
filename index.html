<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 라이브 채팅</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0e0e; --surface: #181818; --surface2: #222;
  --border: rgba(255,255,255,0.08); --text: #f1f1f1;
  --text2: #aaa; --text3: #555; --accent: #ff4444;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

#topbar { height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; }
#logo { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
#live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

#api-row { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#api-input { width: 260px; height: 30px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; font-size: 12px; color: var(--text); outline: none; font-family: monospace; }
#api-btn { height: 30px; padding: 0 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-size: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap; }
#api-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
#api-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); color: var(--text3); white-space: nowrap; }
#api-badge.ok { background: rgba(74,222,128,0.1); color: #4ade80; }
#api-badge.err { background: rgba(248,113,113,0.1); color: #f87171; }

#main { flex: 1; display: flex; overflow: hidden; }

#video-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#video-area { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#video-el { width: 100%; height: 100%; object-fit: contain; display: none; }
#placeholder { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 32px; }
#placeholder h3 { font-size: 15px; font-weight: 500; color: var(--text2); }
#placeholder p { font-size: 12px; color: var(--text3); line-height: 1.7; max-width: 280px; }
#share-btn { height: 38px; padding: 0 22px; background: var(--accent); border: none; border-radius: 8px; color: white; font-size: 13px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; }
#share-btn:hover { opacity: 0.85; }
#stop-btn { position: absolute; top: 12px; right: 12px; display: none; align-items: center; gap: 6px; height: 30px; padding: 0 12px; background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; color: white; font-size: 11px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
#stop-btn.show { display: flex; }

#video-footer { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
#v-title { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
#v-meta { font-size: 11px; color: var(--text3); }

#debug-bar { background: var(--surface2); border-top: 1px solid var(--border); padding: 5px 16px; font-size: 11px; color: var(--text3); font-family: monospace; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
#debug-status { color: #fbbf24; }

#chat-panel { width: 340px; flex-shrink: 0; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
#chat-header { padding: 11px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
#chat-header-title { font-size: 13px; font-weight: 500; }
#viewer-pill { font-size: 11px; color: var(--text3); background: var(--surface2); padding: 3px 10px; border-radius: 20px; display: flex; align-items: center; gap: 5px; }
#v-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

#messages { flex: 1; overflow-y: auto; padding: 6px 2px; }
#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.msg { padding: 3px 12px; border-radius: 3px; font-size: 14.5px; line-height: 1.55; animation: fadeUp 0.2s ease; display: flex; flex-wrap: wrap; gap: 0 6px; }
@keyframes fadeUp { from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)} }
.msg:hover { background: rgba(255,255,255,0.03); }
.nick { font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.txt { color: var(--text); word-break: break-all; }
.msg.system .nick, .msg.system .txt { color: var(--text3); font-style: italic; font-size: 11px; }
.msg.me .nick { color: #60a5fa; }

.typing-row { padding: 4px 12px; display: flex; align-items: center; gap: 7px; font-size: 11px; }
.typing-name { color: var(--text3); }
.dots { display: flex; gap: 3px; }
.dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--text3); animation: db 0.9s infinite; }
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes db{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

#input-area { padding: 10px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
#input-wrap { display: flex; gap: 7px; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px 0 14px; }
#input-wrap:focus-within { border-color: rgba(255,255,255,0.18); }
#chat-input { flex: 1; height: 38px; background: transparent; border: none; outline: none; font-size: 13px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; }
#chat-input::placeholder { color: var(--text3); }
#send-btn { height: 26px; padding: 0 12px; background: var(--accent); border: none; border-radius: 5px; color: white; font-size: 12px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; white-space: nowrap; }
#send-btn:hover { opacity: 0.85; }


#input-wrap { position: relative; }
.action-btn {
  height: 28px;
  min-width: 32px;
  padding: 0 8px;
  background: transparent;
  border: none;
  border-radius: 6px;
  color: var(--text2);
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
}
.action-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
#emoji-btn { font-size: 17px; }
#heart-btn { font-size: 16px; }
#donate-btn {
  font-size: 12px;
  color: #fbbf24;
  border: 1px solid rgba(251,191,36,0.18);
  background: rgba(251,191,36,0.06);
  padding: 0 9px;
}
#donate-btn:hover { background: rgba(251,191,36,0.12); color: #fde68a; }

#emoji-picker {
  position: absolute;
  right: 52px;
  bottom: 48px;
  width: 236px;
  max-height: 200px;
  overflow-y: auto;
  background: #1a1a1a;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 10px;
  display: none;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.38);
  z-index: 20;
}
#emoji-picker.show { display: grid; }
.emoji-item {
  border: none;
  background: transparent;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  padding: 3px;
  border-radius: 8px;
}
.emoji-item:hover { background: rgba(255,255,255,0.06); transform: scale(1.08); }

#heart-layer {
  position: absolute;
  right: 10px;
  bottom: 58px;
  width: 110px;
  height: 220px;
  pointer-events: none;
  overflow: hidden;
  z-index: 15;
}
.floating-heart {
  position: absolute;
  bottom: 0;
  right: 6px;
  font-size: 18px;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.22));
  animation: floatHeart 2.4s ease-out forwards;
  opacity: 0;
}
@keyframes floatHeart {
  0% { transform: translate(0, 0) scale(0.8) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translate(var(--x, -16px), -185px) scale(1.35) rotate(var(--r, 10deg)); opacity: 0; }
}

#video-donation-layer {
  position: absolute;
  top: 20px;
  left: 20px;
  transform: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 18;
  pointer-events: none;
  align-items: flex-start;
  width: min(520px, calc(100vw - 40px));
}
.video-donation-toast {
  min-width: 260px;
  max-width: 420px;
  padding: 12px 16px;
  border-radius: 14px;
  background: rgba(18,18,18,0.9);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 14px 32px rgba(0,0,0,0.42);
  animation: donationToast 4.2s ease forwards;
}
.video-donation-head { display:flex; align-items:center; gap:8px; }
.video-donation-name { color:#fbbf24; font-size:13px; font-weight:700; }
.video-donation-amount { color:#fb923c; font-size:13px; font-weight:700; }
.video-donation-msg { margin-top:6px; color:#f3f4f6; font-size:14px; line-height:1.45; word-break:break-word; }
@keyframes donationToast {
  0% { opacity:0; transform: translateY(-12px) scale(0.96); }
  12% { opacity:1; transform: translateY(0) scale(1); }
  84% { opacity:1; transform: translateY(0) scale(1); }
  100% { opacity:0; transform: translateY(-8px) scale(0.98); }
}

#donation-modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.42);
  z-index: 50;
}
#donation-modal.show { display: flex; }
#donation-card {
  width: min(340px, calc(100vw - 32px));
  background: #171717;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  box-shadow: 0 18px 48px rgba(0,0,0,0.48);
  padding: 16px;
}
#donation-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
#donation-card p { font-size: 12px; color: var(--text3); margin-bottom: 14px; line-height: 1.5; }
.donation-field { margin-bottom: 10px; }
.donation-field label { display:block; font-size:11px; color: var(--text2); margin-bottom: 5px; }
.donation-field input, .donation-field textarea {
  width: 100%;
  background: #222;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  color: var(--text);
  padding: 10px 12px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
}
.donation-field textarea { resize: none; min-height: 84px; }
.donation-field input:focus, .donation-field textarea:focus { border-color: rgba(251,191,36,0.3); }
#donation-actions { display:flex; justify-content:flex-end; gap:8px; margin-top: 14px; }
#donation-cancel, #donation-submit {
  height: 34px;
  border-radius: 10px;
  border: none;
  padding: 0 14px;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
}
#donation-cancel { background: #2b2b2b; color: var(--text2); }
#donation-submit { background: linear-gradient(90deg, #fbbf24, #fb923c); color: #111; }
#donation-cancel:hover { background: #313131; color: var(--text); }
#donation-submit:hover { filter: brightness(1.03); }



/* --- social upgrade --- */
#donate-btn {
  background: linear-gradient(90deg, rgba(251,191,36,0.14), rgba(249,115,22,0.12));
  border-color: rgba(251,191,36,0.28);
  color: #fde68a;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
}
#donate-btn:hover {
  background: linear-gradient(90deg, rgba(251,191,36,0.24), rgba(249,115,22,0.18));
  color: #fff3c4;
}
#heart-btn.active-burst { transform: scale(1.08); }
#heart-layer {
  width: 132px;
  height: 260px;
  right: 6px;
  bottom: 50px;
}
.floating-heart {
  filter: drop-shadow(0 4px 14px rgba(0,0,0,0.28));
  animation: floatHeart 2.9s cubic-bezier(.2,.7,.2,1) forwards;
}
@keyframes floatHeart {
  0% { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  100% { transform: translate(var(--x, -22px), -220px) scale(1.55) rotate(var(--r, 10deg)); opacity: 0; }
}
#video-donation-layer {
  top: 20px;
  left: 20px;
  transform: none;
  width: min(520px, calc(100vw - 40px));
  align-items: flex-start;
}
.video-donation-toast {
  position: relative;
  overflow: hidden;
  min-width: 320px;
  max-width: 520px;
  border-radius: 16px;
  padding: 14px 18px;
  backdrop-filter: blur(8px);
  transform-origin: top left;
}
.video-donation-toast.stack-move {
  transition: transform 380ms cubic-bezier(.2,.8,.2,1);
}

.video-donation-toast::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.16) 18%, transparent 38%);
  transform: translateX(-120%);
  animation: toastShine 3.8s ease forwards;
  pointer-events: none;
}
@keyframes toastShine {
  0% { transform: translateX(-120%); }
  25% { transform: translateX(120%); }
  100% { transform: translateX(120%); }
}
.video-donation-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.9);
  margin-bottom: 8px;
}
.video-donation-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.video-donation-name-wrap { display:flex; align-items:center; gap:8px; min-width:0; }
.video-donation-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  font-size: 14px; font-weight: 800;
  color: #fff; background: rgba(255,255,255,0.12);
  flex-shrink: 0;
}
.video-donation-name {
  color:#fff; font-size:14px; font-weight:800;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.video-donation-amount {
  color:#fff; font-size:17px; font-weight:900; letter-spacing:-0.02em;
  flex-shrink: 0;
}
.video-donation-msg {
  margin-top:8px; font-size:15px; line-height:1.45;
}
.video-donation-toast.tier-blue { background: linear-gradient(135deg, rgba(29,78,216,0.94), rgba(30,64,175,0.9)); border: 1px solid rgba(147,197,253,0.42); }
.video-donation-toast.tier-cyan { background: linear-gradient(135deg, rgba(8,145,178,0.94), rgba(14,116,144,0.9)); border: 1px solid rgba(103,232,249,0.42); }
.video-donation-toast.tier-green { background: linear-gradient(135deg, rgba(22,163,74,0.94), rgba(21,128,61,0.9)); border: 1px solid rgba(134,239,172,0.42); }
.video-donation-toast.tier-yellow { background: linear-gradient(135deg, rgba(202,138,4,0.96), rgba(234,88,12,0.9)); border: 1px solid rgba(253,224,71,0.42); }
.video-donation-toast.tier-orange { background: linear-gradient(135deg, rgba(234,88,12,0.96), rgba(220,38,38,0.9)); border: 1px solid rgba(253,186,116,0.44); }
.video-donation-toast.tier-pink { background: linear-gradient(135deg, rgba(190,24,93,0.96), rgba(126,34,206,0.92)); border: 1px solid rgba(244,114,182,0.44); }
.video-donation-toast.tier-red { background: linear-gradient(135deg, rgba(220,38,38,0.97), rgba(127,29,29,0.94)); border: 1px solid rgba(252,165,165,0.46); box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 18px 40px rgba(127,29,29,0.35); }

.donation-tier-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 8px;
  margin-top: 10px;
  margin-bottom: 12px;
}
.tier-chip {
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 8px 6px;
  background: #202020;
  color: #ddd;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 700;
}
.tier-chip:hover { border-color: rgba(255,255,255,0.18); transform: translateY(-1px); }
.tier-chip.blue { background: linear-gradient(135deg, rgba(29,78,216,0.22), rgba(30,64,175,0.12)); }
.tier-chip.cyan { background: linear-gradient(135deg, rgba(8,145,178,0.22), rgba(14,116,144,0.12)); }
.tier-chip.green { background: linear-gradient(135deg, rgba(22,163,74,0.22), rgba(21,128,61,0.12)); }
.tier-chip.yellow { background: linear-gradient(135deg, rgba(202,138,4,0.24), rgba(234,88,12,0.14)); }
.tier-chip.orange { background: linear-gradient(135deg, rgba(234,88,12,0.24), rgba(220,38,38,0.14)); }
.tier-chip.pink { background: linear-gradient(135deg, rgba(190,24,93,0.24), rgba(126,34,206,0.14)); }
.tier-chip.red { background: linear-gradient(135deg, rgba(220,38,38,0.28), rgba(127,29,29,0.18)); }
#donation-preview {
  margin-top: 12px;
  border-radius: 14px;
  padding: 12px 14px;
  color: white;
  background: linear-gradient(135deg, rgba(29,78,216,0.94), rgba(30,64,175,0.9));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}
#donation-preview .preview-top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
#donation-preview .preview-name { font-size:13px; font-weight:800; }
#donation-preview .preview-amount { font-size:15px; font-weight:900; }
#donation-preview .preview-msg { margin-top:8px; font-size:13px; line-height:1.4; opacity:0.96; }
.chat-donation-card {
  margin: 7px 8px;
  padding: 10px 12px;
  border-radius: 10px;
  animation: fadeUp 0.3s ease;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
}
.chat-donation-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.chat-donation-name { font-size: 11px; font-weight: 800; }
.chat-donation-amount { font-size: 12px; font-weight: 900; }
.chat-donation-msg { margin-top: 6px; font-size: 12.5px; color: rgba(255,255,255,0.94); word-break: break-word; }
.chat-donation-card.tier-blue { background: linear-gradient(90deg, rgba(29,78,216,0.28), rgba(30,64,175,0.14)); border-left: 3px solid #60a5fa; }
.chat-donation-card.tier-cyan { background: linear-gradient(90deg, rgba(8,145,178,0.28), rgba(14,116,144,0.14)); border-left: 3px solid #67e8f9; }
.chat-donation-card.tier-green { background: linear-gradient(90deg, rgba(22,163,74,0.28), rgba(21,128,61,0.14)); border-left: 3px solid #86efac; }
.chat-donation-card.tier-yellow { background: linear-gradient(90deg, rgba(202,138,4,0.28), rgba(234,88,12,0.14)); border-left: 3px solid #fde047; }
.chat-donation-card.tier-orange { background: linear-gradient(90deg, rgba(234,88,12,0.28), rgba(220,38,38,0.14)); border-left: 3px solid #fdba74; }
.chat-donation-card.tier-pink { background: linear-gradient(90deg, rgba(190,24,93,0.28), rgba(126,34,206,0.14)); border-left: 3px solid #f9a8d4; }
.chat-donation-card.tier-red { background: linear-gradient(90deg, rgba(220,38,38,0.3), rgba(127,29,29,0.18)); border-left: 3px solid #fca5a5; }
#heart-counter {
  position:absolute;
  right: 12px;
  bottom: 18px;
  min-width: 46px;
  height: 24px;
  padding: 0 8px;
  border-radius: 999px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(236,72,153,0.18);
  border: 1px solid rgba(244,114,182,0.24);
  pointer-events:none;
  opacity:0;
  transform: translateY(6px);
  transition: opacity .25s ease, transform .25s ease;
  z-index: 16;
}
#heart-counter.show { opacity:1; transform: translateY(0); }



/* password lock */
#lock-screen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
#lock-box{
  width:320px;
  max-width:calc(100vw - 32px);
  background:#181818;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px;
  padding:22px 18px 18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.45);
}
#lock-title{
  font-size:18px;
  font-weight:700;
  color:#f3f4f6;
  margin-bottom:8px;
}
#lock-desc{
  font-size:12px;
  color:#9ca3af;
  margin-bottom:14px;
  line-height:1.5;
}
#lock-input{
  width:100%;
  height:42px;
  background:#222;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;
  padding:0 12px;
  font-size:14px;
  color:#fff;
  outline:none;

function randItem(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function randomBot(exclude) {
  exclude=exclude||[];
  var pool=BOTS.filter(function(b){ return !exclude.includes(b.nick)&&!recentlyUsed.includes(b.nick); });
  if(!pool.length) pool=BOTS.filter(function(b){ return !exclude.includes(b.nick); });
  if(!pool.length) pool=BOTS;
  var bot=pool[Math.floor(Math.random()*pool.length)];
  recentlyUsed.push(bot.nick);
  if(recentlyUsed.length>7) recentlyUsed.shift();
  return bot;
}


function getTimeBucket(){
  var hour = new Date().getHours();
  if(hour >= 5 && hour < 11) return 'morning';
  if(hour >= 11 && hour < 18) return 'day';
  if(hour >= 18 && hour < 23) return 'evening';
  return 'night';
}

function getTimedMsgs(){
  return TIME_REACTION_MSGS[getTimeBucket()] || [];
}

function runTimedStartScenario(){
  var bucket = getTimeBucket();
  var starts = COMMON_START_SCENARIOS.slice();
  if(TIME_START_SCENARIOS[bucket]) starts = starts.concat(TIME_START_SCENARIOS[bucket]);
  var scenario = randItem(starts);
  scenario.forEach(function(item){
    setTimeout(function(){
      if(item.type === 'msg') addMsg(item.nick, item.msg, false, false, item.color);
      else if(item.type === 'enter') addEnter(item.nick);
      else if(item.type === 'notice') addNotice(item.msg || item.text);
    }, item.t);
  });

  setTimeout(function(){
    addNotice(randItem(NOTICE_MSGS));
  }, Math.floor(Math.random()*9000)+17000);

  setTimeout(function(){
    if(Math.random() < 0.8) addDonation();
  }, Math.floor(Math.random()*15000)+28000);

  setTimeout(function(){
    playScenario();
  }, Math.floor(Math.random()*50000)+70000);
}

function animateDonationStack(layer){
  if(!layer) return;
  var items = Array.prototype.slice.call(layer.children);
  var first = new Map();
  items.forEach(function(el){
    first.set(el, el.getBoundingClientRect());
  });
  return function(){
    items.forEach(function(el){
      var prev = first.get(el);
      if(!prev) return;
      var next = el.getBoundingClientRect();
      var dx = prev.left - next.left;
      var dy = prev.top - next.top;
      if(dx || dy){
        el.classList.add('stack-move');
        el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        el.getBoundingClientRect();
        el.style.transform = '';
        setTimeout(function(){ el.classList.remove('stack-move'); }, 420);
      }
    });
  };
}

async function fireOne(msgPool,exclude){
  var bot=randomBot(exclude);
  var id='b'+Date.now()+Math.random();
  var r=Math.random();

  var pool =
	timedMsgs.length && r < 0.10 ? timedMsgs :
	r < 0.22 ? EMOJI_MSGS :
	r < 0.62 ? SHORT_MSGS :
	r < 0.72 ? TIMESTAMP_MSGS :
	msgPool;
  var delay=Math.random()*900+400;
  addTyping(id,bot.nick,bot.color);
  await new Promise(function(r){setTimeout(r,delay);});
  removeTyping(id);
  addMsg(bot.nick,randItem(pool),false,false,bot.color);
  return bot.nick;
}

// 시나리오 재생 — 여러 명이 흐름 있게 대화
async function playScenario(){
  var available = SCENARIOS.filter(function(s, i){
    return Array.isArray(s) && s.length && !usedScenarios.includes(i);
  });

  if(!available.length){
    usedScenarios = [];
    available = SCENARIOS.filter(function(s){
      return Array.isArray(s) && s.length;
    });
  }

  if(!available.length) return;

  var idx = Math.floor(Math.random()*available.length);
  var realIdx = SCENARIOS.indexOf(available[idx]);
  usedScenarios.push(realIdx);

  var lines = available[idx];
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    if(!line) continue;

    var id='s'+Date.now()+i;
    var gap=Math.random()*2000+1200;
    await new Promise(function(r){setTimeout(r,gap);});
    addTyping(id,line.nick,line.color);
    await new Promise(function(r){setTimeout(r,Math.random()*1000+600);});
    removeTyping(id);
    addMsg(line.nick,line.msg,false,false,line.color);
  }
}

  if(schedulersStarted) return;
  schedulersStarted = true;
  scheduleAuto();
  scheduleScenario();
  scheduleBurst();
  scheduleDonation();
  scheduleEnterExit();
  scheduleNotice();
}

async function startShare(){
  try{
    var stream=await navigator.mediaDevices.getDisplayMedia({video:{cursor:'always'},audio:{systemAudio:'include'}});
    isCapturing=true;
    var video=$('video-el');
    video.srcObject=stream; video.style.display='block';
    $('placeholder').style.display='none';
    $('stop-btn').classList.add('show');
    $('v-title').textContent='강의 시청 중';
    $('v-meta').textContent='화면 공유 진행 중';
    setDebug('라이브 중');
    startTimer();
    addMsg('시스템','화면 공유 연결됨!',false,true);
    stream.getTracks().forEach(function(t){t.onended=stopShare;});
    setTimeout(function(){addEnter('새로운시청자');},1500);
    setTimeout(function(){fireOne(AUTO_MSGS,[]);},5000);
    startSchedulers();
  }catch(e){
    if(e.name!=='NotAllowedError') addMsg('시스템','화면 공유 실패: '+e.message,false,true);
  }
}

function stopShare(){
  isCapturing=false; stopTimer();
  var video=$('video-el');
  if(video.srcObject){video.srcObject.getTracks().forEach(function(t){t.stop();});video.srcObject=null;}
  video.style.display='none';
  $('placeholder').style.display='flex';
  $('stop-btn').classList.remove('show');
  $('v-title').textContent='공유가 중지됐어요';
  setDebug('공유 중지');
}

function sendChat(){
  var text=$('chat-input').value.trim();
  if(!text) return;
  $('chat-input').value='';
  var nick=($('nick-input').value.trim())||'나';
  addMsg(nick,text,true);
  replyToUser();
}

$('share-btn').onclick=startShare;
$('stop-btn').onclick=stopShare;
$('send-btn').onclick=sendChat;
$('chat-input').onkeydown=function(e){if(e.key==='Enter')sendChat();};
$('api-btn').onclick=function(){addMsg('시스템','API 없이도 잘 됩니다 ㅋㅋ',false,true);};
$('emoji-btn').onclick=function(e){ e.stopPropagation(); toggleEmojiPicker(); };
$('heart-btn').onclick=function(){ burstHearts(Math.floor(Math.random()*2)+4); };
$('donate-btn').onclick=function(){ openDonationModal(); };
$('donation-cancel').onclick=closeDonationModal;
$('donation-submit').onclick=sendFakeDonation;
$('donation-modal').onclick=function(e){ if(e.target===this) closeDonationModal(); };
document.addEventListener('click', function(e){

$('donation-message-input').onkeydown=function(e){ if((e.ctrlKey || e.metaKey) && e.key==='Enter') sendFakeDonation(); };
$('donation-amount-input').oninput=updateDonationPreview;
$('donation-message-input').oninput=updateDonationPreview;
Array.prototype.forEach.call(document.querySelectorAll('.tier-chip'), function(btn){

    $('donation-amount-input').value = this.dataset.amount || '1000';
    updateDonationPreview();

$('nick-input').addEventListener('input', updateDonationPreview);

setDebug('활성');
startSchedulers();
runTimedStartScenario();


(function(){
  const PASSWORD = 'shambi';
  const STORAGE_KEY = 'lecture_chat_unlock_v1';

  const lockScreen = document.getElementById('lock-screen');
  const lockInput = document.getElementById('lock-input');
  const lockBtn = document.getElementById('lock-btn');
  const lockError = document.getElementById('lock-error');

  function unlockPage(){
    if(lockScreen) lockScreen.style.display = 'none';
  }

  function tryUnlock(){
    const value = (lockInput && lockInput.value || '').trim();
    if(value === PASSWORD){
      sessionStorage.setItem(STORAGE_KEY, 'ok');
      unlockPage();
    }else{
      if(lockError) lockError.textContent = '비밀번호가 올바르지 않습니다.';
      if(lockInput){
        lockInput.value = '';
        lockInput.focus();
      }
    }
  }

  if(sessionStorage.getItem(STORAGE_KEY) === 'ok'){
    unlockPage();
    return;
  }

  if(lockBtn) lockBtn.addEventListener('click', tryUnlock);
  if(lockInput) lockInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') tryUnlock();
  });

  setTimeout(function(){
    if(lockInput) lockInput.focus();
  }, 50);
})();

</script>
